<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중2 영어 독해 학습</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f7f6;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; color: #1e40af; margin-bottom: 8px; }
    .subtitle { text-align: center; color: #666; margin-bottom: 24px; }
    textarea {
      width: 100%;
      min-height: 160px;
      padding: 16px;
      font-size: 16px;
      line-height: 1.6;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      resize: vertical;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: #3b82f6; }
    button {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      margin: 16px 0;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    #result { margin-top: 24px; }
    .sentence-pair {
      margin-bottom: 24px;
      padding: 16px;
      background: #f8fafc;
      border-radius: 8px;
      border-left: 4px solid #3b82f6;
    }
    .english {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .korean {
      font-size: 15px;
      color: #4b5563;
      line-height: 1.5;
    }
    .speaker {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      margin-left: 8px;
      vertical-align: middle;
      opacity: 0.6;
    }
    .speaker:hover { opacity: 1; }
    .word {
      color: #2563eb;
      cursor: pointer;
      text-decoration: underline dotted;
    }
    .popup {
      position: absolute;
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      z-index: 100;
      max-width: 250px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>중2 영어 독해 학습</h1>
    <p class="subtitle">영어 지문을 입력하면 문장별 번역과 발음을 제공합니다.</p>

    <textarea id="input" placeholder="학습할 영어 지문을 입력하세요..."></textarea>
    <button id="btn">번역 및 분석 시작</button>

    <div id="result"></div>
  </div>

  <script>
    const input = document.getElementById('input');
    const btn = document.getElementById('btn');
    const resultDiv = document.getElementById('result');

    const simpleDict = {
      dog: { pos: "명사", meaning: "개", explain: "친숙한 반려동물" },
      family: { pos: "명사", meaning: "가족", explain: "함께 사는 소중한 사람들" },
      special: { pos: "형용사", meaning: "특별한", explain: "보통과 다른 성질이 있는" },
      happy: { pos: "형용사", meaning: "행복한", explain: "기쁘고 즐거운 상태" },
      school: { pos: "명사", meaning: "학교", explain: "공부를 배우는 곳" }
      // 여기에 단어를 추가하면 팝업 기능이 활성화됩니다.
    };

    btn.addEventListener('click', async () => {
      const text = input.value.trim();
      if (!text) {
        alert('영어 지문을 입력해주세요.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'AI 번역 처리 중...';
      resultDiv.innerHTML = '<p style="text-align:center; color:#6b7280;">문장을 분석하고 번역하는 중입니다...</p>';

      try {
        // 1. 영어 문장 분리
        const sentences = text.split(/(?<=[.!?])\s+/).filter(s => s.trim());
        resultDiv.innerHTML = '';

        // 2. 각 문장별로 번역 요청 (MyMemory API 사용)
        for (let engSentence of sentences) {
          const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(engSentence)}&langpair=en|ko`);
          const data = await response.json();
          const korSentence = data.responseData.translatedText;

          // 결과 UI 생성
          renderSentence(engSentence, korSentence);
        }

      } catch (err) {
        console.error(err);
        resultDiv.innerHTML = `<p style="color:#dc2626;">번역 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.</p>`;
      } finally {
        btn.disabled = false;
        btn.textContent = '번역 및 분석 시작';
      }
    });

    function renderSentence(eng, kor) {
      const pair = document.createElement('div');
      pair.className = 'sentence-pair';

      // 영어 섹션 (단어 클릭 기능 포함)
      const engDiv = document.createElement('div');
      engDiv.className = 'english';
      
      const wordsHtml = eng.split(/(\s+|\b)/).map(part => {
        const word = part.trim().toLowerCase().replace(/[.?!,]/g, "");
        if (word && simpleDict[word]) {
          return `<span class="word" data-word="${word}">${part}</span>`;
        }
        return part;
      }).join('');

      engDiv.innerHTML = wordsHtml;

      // 발음 버튼
      const speaker = document.createElement('button');
      speaker.className = 'speaker';
      speaker.textContent = '🔊';
      speaker.onclick = () => {
        const ut = new SpeechSynthesisUtterance(eng);
        ut.lang = 'en-US';
        speechSynthesis.speak(ut);
      };
      engDiv.appendChild(speaker);

      // 한국어 섹션
      const korDiv = document.createElement('div');
      korDiv.className = 'korean';
      korDiv.textContent = kor;

      pair.appendChild(engDiv);
      pair.appendChild(korDiv);
      resultDiv.appendChild(pair);

      // 단어 팝업 이벤트 연결
      pair.querySelectorAll('.word').forEach(el => {
        el.onclick = (e) => {
          e.stopPropagation();
          showPopup(e, el.dataset.word);
        };
      });
    }

    function showPopup(e, wordKey) {
      document.querySelectorAll('.popup').forEach(p => p.remove());
      const info = simpleDict[wordKey];
      const popup = document.createElement('div');
      popup.className = 'popup';
      popup.innerHTML = `
        <strong>${wordKey.toUpperCase()}</strong> [${info.pos}]<br>
        <span style="color:#2563eb; font-weight:bold;">뜻: ${info.meaning}</span><br>
        <small style="color:#666;">${info.explain}</small>
      `;
      
      document.body.appendChild(popup);
      popup.style.left = e.pageX + 'px';
      popup.style.top = (e.pageY + 10) + 'px';

      const closePopup = () => {
        popup.remove();
        document.removeEventListener('click', closePopup);
      };
      setTimeout(() => document.addEventListener('click', closePopup), 10);
    }
  </script>
</body>
</html>
