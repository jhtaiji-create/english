<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리딸 영어 독해 학습</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #f4f7f6; color: #333; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #1e40af; margin-bottom: 8px; }
    .subtitle { text-align: center; color: #666; margin-bottom: 24px; }
    textarea { width: 100%; min-height: 120px; padding: 16px; font-size: 16px; line-height: 1.6; border: 2px solid #e5e7eb; border-radius: 8px; resize: vertical; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
    textarea:focus { border-color: #3b82f6; }
    
    .primary-btn { width: 100%; padding: 14px; font-size: 17px; background: #2563eb; color: white; border: none; border-radius: 8px; margin: 16px 0; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .primary-btn:hover { background: #1d4ed8; }
    .test-btn { background: #10b981; display: none; margin-top: 10px; }
    .test-btn:hover { background: #059669; }
    
    #result { margin-top: 24px; }
    .sentence-pair { margin-bottom: 24px; padding: 16px; background: #f8fafc; border-radius: 8px; border-left: 4px solid #3b82f6; position: relative; }
    .english { font-size: 18px; line-height: 1.8; margin-bottom: 8px; font-weight: 500; color: #1f2937; }
    .korean { font-size: 15px; color: #6b7280; line-height: 1.5; }
    
    .speaker-btn { background: none; border: none; font-size: 18px; cursor: pointer; opacity: 0.4; transition: 0.2s; vertical-align: middle; }
    .speaker-btn:hover { opacity: 1; transform: scale(1.1); }
    
    .word { cursor: pointer; border-bottom: 1px dashed #cbd5e1; padding: 0 1px; transition: all 0.2s; }
    .word:hover { background: #dbeafe; color: #2563eb; border-bottom-color: #2563eb; }
    
    .popup { position: absolute; background: #fff; border: 1px solid #d1d5db; border-radius: 12px; padding: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 1000; min-width: 200px; animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .popup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
    .popup-word { font-size: 18px; font-weight: bold; color: #1e40af; }
    .popup-meaning { font-size: 16px; color: #111827; font-weight: 600; margin: 8px 0; }
    .naver-link { display: block; margin-top: 10px; font-size: 12px; color: #10b981; text-decoration: none; text-align: right; }

    #test-area { display: none; margin-top: 30px; padding: 20px; border-radius: 12px; background: #eff6ff; border: 2px solid #3b82f6; }
    .test-item { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .test-kor { font-weight: 600; color: #1e40af; margin-bottom: 10px; font-size: 15px; }
    .test-input { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 6px; font-size: 16px; box-sizing: border-box; outline: none; }
    .test-input:focus { border-color: #3b82f6; }
    .feedback { margin-top: 8px; font-size: 14px; font-weight: bold; }
    .correct { color: #059669; }
    .incorrect { color: #dc2626; }

    /* 공부 모드일 때 숨겨질 영역들을 위한 클래스 */
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <h1>우리딸 영어 독해 학습</h1>
    <p class="subtitle">서현아 모르는 단어를 클릭해봐★크롬에서 가장 잘 들려요!!</p>

    <div id="study-input-area">
      <textarea id="input" placeholder="사랑해 서현아 여기다 영어를 입력해봐..."></textarea>
      <button id="btn" class="primary-btn">번역 및 분석 시작</button>
    </div>

    <div id="result"></div>
    
    <button id="test-start-btn" class="primary-btn test-btn">📝 영작 테스트 시작하기</button>

    <div id="test-area">
      <h3 style="margin-top:0; text-align:center;">✍️ 서현이의 영작 도전!</h3>
      <p style="font-size:13px; color:#666; text-align:center;">한글을 보고 영어로 쓴 뒤 'Enter'를 눌러봐!</p>
      <div id="test-list"></div>
      <button id="go-back-btn" style="background:none; border:none; color:#666; text-decoration:underline; cursor:pointer; width:100%; margin-top:10px;">다시 공부하러 가기</button>
    </div>
  </div>

  <script>
    const input = document.getElementById('input');
    const btn = document.getElementById('btn');
    const resultDiv = document.getElementById('result');
    const testStartBtn = document.getElementById('test-start-btn');
    const testArea = document.getElementById('test-area');
    const testList = document.getElementById('test-list');
    const studyInputArea = document.getElementById('study-input-area');
    const goBackBtn = document.getElementById('go-back-btn');

    let studyData = [];

    const simpleDict = {
      dog: { pos: "명사", meaning: "개", explain: "사람과 가장 친한 반려동물" },
      special: { pos: "형용사", meaning: "특별한", explain: "보통과 다르거나 매우 소중한" },
      family: { pos: "명사", meaning: "가족", explain: "함께 생활하며 사랑하는 사람들" }
    };

    function speak(text) {
      window.speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(text);
      ut.lang = 'en-US';
      ut.rate = 0.9;
      window.speechSynthesis.speak(ut);
    }

    // [중요] 다시 공부하러 가기 버튼 클릭 시 동작
    goBackBtn.onclick = () => {
      testArea.style.display = 'none';      // 테스트 영역 숨기기
      studyInputArea.style.display = 'block'; // 입력창 다시 보이기
      resultDiv.style.display = 'block';     // 분석 결과 다시 보이기
      testStartBtn.style.display = 'block';  // 테스트 버튼 다시 보이기
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    btn.addEventListener('click', async () => {
      const text = input.value.trim();
      if (!text) return alert('지문을 입력하세요.');

      btn.disabled = true;
      btn.textContent = '지문 분석 중...';
      resultDiv.innerHTML = '';
      studyData = [];
      testArea.style.display = 'none';

      const sentences = text.split(/(?<=[.!?])\s+/).filter(s => s.trim());

      for (let eng of sentences) {
        try {
          const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(eng)}&langpair=en|ko`);
          const data = await res.json();
          const kor = data.responseData.translatedText;
          
          studyData.push({ eng, kor });
          renderSentence(eng, kor);
        } catch (e) {
          renderSentence(eng, "번역 서버 오류");
        }
      }
      btn.disabled = false;
      btn.textContent = '번역 및 분석 시작';
      testStartBtn.style.display = 'block';
    });

    function renderSentence(eng, kor) {
      const pair = document.createElement('div');
      pair.className = 'sentence-pair';

      const engDiv = document.createElement('div');
      engDiv.className = 'english';
      
      const words = eng.split(/([^a-zA-Z]+)/);
      words.forEach(part => {
        if (/^[a-zA-Z]+$/.test(part)) {
          const span = document.createElement('span');
          span.className = 'word';
          span.textContent = part;
          span.onclick = (e) => {
            e.stopPropagation();
            const cleanWord = part.toLowerCase();
            if (simpleDict[cleanWord]) showWordPopup(e, cleanWord);
            else openNaverDict(part);
          };
          engDiv.appendChild(span);
        } else {
          engDiv.appendChild(document.createTextNode(part));
        }
      });

      const speakBtn = document.createElement('button');
      speakBtn.className = 'speaker-btn';
      speakBtn.innerHTML = ' 🔊';
      speakBtn.onclick = () => speak(eng);
      engDiv.appendChild(speakBtn);

      const korDiv = document.createElement('div');
      korDiv.className = 'korean';
      korDiv.textContent = kor;

      pair.appendChild(engDiv);
      pair.appendChild(korDiv);
      resultDiv.appendChild(pair);
    }

    testStartBtn.onclick = () => {
      testArea.style.display = 'block';
      resultDiv.style.display = 'none';     // 공부 내용 숨기기
      studyInputArea.style.display = 'none'; // 입력창 숨기기
      testStartBtn.style.display = 'none';
      testList.innerHTML = '';

      studyData.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'test-item';
        div.innerHTML = `
          <div class="test-kor">${index + 1}. ${item.kor}</div>
          <input type="text" class="test-input" placeholder="영어로 써보세요!" data-ans="${item.eng}">
          <div class="feedback"></div>
        `;
        
        const inputField = div.querySelector('.test-input');
        const feedback = div.querySelector('.feedback');

        inputField.onkeypress = (e) => {
          if (e.key === 'Enter') {
            const userVal = inputField.value.trim();
            const ansVal = inputField.dataset.ans.trim();
            
            if (userVal.toLowerCase().replace(/[.?!,]/g, "") === ansVal.toLowerCase().replace(/[.?!,]/g, "")) {
              feedback.innerHTML = "✅ 정답이야 서현아! 최고!";
              feedback.className = "feedback correct";
            } else {
              feedback.innerHTML = `❌ 아쉽다! 정답은: ${ansVal}`;
              feedback.className = "feedback incorrect";
            }
          }
        };
        testList.appendChild(div);
      });
      window.scrollTo({ top: testArea.offsetTop, behavior: 'smooth' });
    };

    function openNaverDict(word) {
      const w = 500; const h = 600;
      const left = (window.innerWidth / 2) - (w / 2);
      const top = (window.innerHeight / 2) - (h / 2);
      speak(word);
      window.open(`https://en.dict.naver.com/#/search?query=${word}`, 'naverDict', `width=${w},height=${h},top=${top},left=${left},scrollbars=yes`);
    }

    function showWordPopup(e, wordKey) {
      document.querySelectorAll('.popup').forEach(p => p.remove());
      const info = simpleDict[wordKey];
      const popup = document.createElement('div');
      popup.className = 'popup';
      popup.innerHTML = `
        <div class="popup-header">
          <span class="popup-word">${wordKey.toUpperCase()}</span>
          <button class="speaker-btn" id="pop-speak">🔊</button>
        </div>
        <div class="popup-meaning">${info.meaning}</div>
        <div class="popup-explain">${info.explain}</div>
        <a href="https://en.dict.naver.com/#/search?query=${wordKey}" target="_blank" class="naver-link">더 자세히 보기 →</a>
      `;
      document.body.appendChild(popup);
      popup.style.left = Math.min(window.innerWidth - 220, e.pageX) + 'px';
      popup.style.top = (e.pageY + 15) + 'px';
      popup.querySelector('#pop-speak').onclick = (ev) => { ev.stopPropagation(); speak(wordKey); };
      const close = (ev) => { if(!popup.contains(ev.target)) { popup.remove(); document.removeEventListener('click', close); } };
      setTimeout(() => document.addEventListener('click', close), 10);
    }
  </script>
</body>
</html>
