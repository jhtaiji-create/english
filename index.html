<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중2 영어 독해 학습</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background: #f8f9fa;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      color: #1a73e8;
    }
    textarea {
      width: 100%;
      min-height: 180px;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      resize: vertical;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      margin: 16px 0 8px;
      cursor: pointer;
    }
    button:hover {
      background: #1557b0;
    }
    #result {
      margin-top: 20px;
      line-height: 1.6;
    }
    .sentence {
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>중2 영어 독해 학습</h1>
    <p>영어 지문을 입력한 후 버튼을 눌러보세요.</p>

    <textarea id="input" placeholder="여기에 영어 문장이나 지문을 붙여넣으세요..."></textarea>
    <button id="btn">번역 및 분석</button>

    <div id="result"></div>
  </div>

  <script>
    const input = document.getElementById('input');
    const btn = document.getElementById('btn');
    const result = document.getElementById('result');

    btn.addEventListener('click', () => {
      const text = input.value.trim();
      if (!text) {
        alert('영어 지문을 입력해주세요.');
        return;
      }

      result.innerHTML = '<p style="color:#555; font-weight:bold;">입력한 내용:</p>' +
                         '<p style="white-space: pre-wrap;">' + text + '</p>' +
                         '<hr>' +
                         '<p style="color:#1a73e8; font-weight:bold;">작동 확인</p>' +
                         '<p>버튼이 정상적으로 눌렸습니다!</p>' +
                         '<p>이제 여기에 번역이나 단어 분석 기능을 붙일 수 있습니다.</p>';
    });
  </script>
</body>
</html>
